# Quality gates (TESTING.md §9, FND-AC-10). A pull request merges only when every job passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_ENV: ci
  SOLANA_CLUSTER: devnet
  NEXT_PUBLIC_SOLANA_CLUSTER: devnet
  SOLANA_RPC_URL: https://api.devnet.solana.com
  PUBLIC_APP_ORIGIN: http://localhost:3000
  API_INTERNAL_URL: http://localhost:4000
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Lint, typecheck, boundaries, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Unit, integration, contract, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sct_admin
          POSTGRES_PASSWORD: ci-admin-only
          POSTGRES_DB: solana_terminal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sct_admin -d solana_terminal"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.8.3-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        env:
          PGPASSWORD: ci-admin-only
        run: psql -h localhost -U sct_admin -d solana_terminal -f infra/docker/postgres/init/01-roles.sql
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm check:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-build
          path: apps/terminal/.next
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: End-to-end (Devnet)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sct_admin
          POSTGRES_PASSWORD: ci-admin-only
          POSTGRES_DB: solana_terminal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sct_admin -d solana_terminal"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.8.3-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        env:
          PGPASSWORD: ci-admin-only
        run: psql -h localhost -U sct_admin -d solana_terminal -f infra/docker/postgres/init/01-roles.sql
      - uses: actions/download-artifact@v4
        with:
          name: terminal-build
          path: apps/terminal/.next
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
