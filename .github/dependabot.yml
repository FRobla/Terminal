version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      solana:
        patterns: ["@solana/*", "@solana-program/*"]
      tooling:
        patterns:
          [
            "eslint*",
            "@eslint/*",
            "typescript-eslint",
            "prettier",
            "vitest",
            "@vitest/*",
            "@playwright/*",
            "turbo",
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
