# Local development infrastructure (OPERATIONS.md §4). Credentials here are for local use only.
name: solana-terminal

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: sct_admin
      POSTGRES_PASSWORD: local-admin-only
      POSTGRES_DB: solana_terminal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sct_admin -d solana_terminal"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
